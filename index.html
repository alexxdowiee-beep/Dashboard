<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Shared ecosystem palette — same as Forge and Fuel. */
  :root {
    --bg: #0A0A0B;
    --surface: #141416;
    --surface2: #1D1E21;
    --ink: #F5F5F6;
    --muted: #A1A2A7;
    --faint: #7D7F85;
    --line: #26272B;
    --brand: #FF4A16;
    --brand-ink: #120B07;
    --gold: #F0B429;
    --good: #5FBF6E;
    --danger: #E5484D;
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  ::-webkit-scrollbar { display:none; }

  .app { max-width: 520px; margin: 0 auto; min-height: 100%; display:flex; flex-direction:column; }

  header.topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
    border-bottom: 2px solid var(--brand);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand svg { width:24px; height:24px; flex-shrink:0; }
  .brand .wordmark {
    font-size: 19px; letter-spacing: 0.22em; text-transform: uppercase; font-weight:700;
  }
  .topbar .sub { font-size: 12px; color: var(--muted); font-weight:700; font-variant-numeric: tabular-nums; }

  main { flex:1; padding: 16px 18px 92px; }
  .screen { display:none; }
  .screen.active { display:block; animation: fade .16s ease-out; }
  @keyframes fade { from { opacity:0; transform: translateY(5px);} to { opacity:1; transform:none; } }

  /* ---- app card ---- */
  .app-card { background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:13px; }
  .app-card.empty { border-style: dashed; }
  .ac-head { display:flex; align-items:center; gap:10px; margin-bottom:3px; }
  .ac-bar { width:4px; align-self:stretch; min-height:26px; border-radius:3px; background: var(--brand); flex-shrink:0; margin-left:-4px; }
  .ac-name { font-family: var(--font-display); font-size:16px; text-transform:uppercase; letter-spacing:0.05em; }
  .ac-open { margin-left:auto; font-size:12px; font-weight:700; color: var(--brand); text-decoration:none; white-space:nowrap; }
  .ac-headline { font-size:14px; color: var(--ink); margin-bottom:2px; }
  .ac-when { font-size:12px; color: var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
  .ac-when.stale { color: var(--gold); }
  .ac-empty { font-size:13px; color: var(--muted); line-height:1.5; }

  .tiles { display:grid; grid-template-columns: repeat(3, 1fr); gap:7px; margin-top:13px; }
  .tile { background: var(--surface2); border:1px solid var(--line); border-radius:11px; padding:10px 5px; text-align:center; }
  .tile .v { font-family: var(--font-display); font-size:19px; line-height:1.1; font-variant-numeric: tabular-nums; }
  .tile .v .u { font-size:12px; color: var(--muted); margin-left:1px; }
  .tile .v .of { font-size:12px; color: var(--muted); }
  .tile .l { font-size:12px; color: var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-top:3px; }
  .tile.flag .v { color: var(--brand); }

  /* ---- trend charts ---- */
  .trends { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:13px; }
  .tc { background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 12px 10px; position:relative; min-width:0; }
  .tc-top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .tc-l { font-size:12px; font-weight:700; color: var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .tc-open { font-size:12px; font-weight:700; color: var(--brand); text-decoration:none; }
  .tc-v { font-family: var(--font-display); font-size:21px; margin:3px 0 4px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .tc-v small { font-family: var(--font-body); font-size:12px; color: var(--muted); font-weight:700; }
  .tc svg { display:block; width:100%; height:52px; overflow:visible; }
  .tc-note { font-size:12px; font-weight:700; color: var(--muted); margin-top:5px; line-height:1.35; }
  .tc-tip { position:absolute; left:12px; right:12px; top:8px; background: var(--ink); color: var(--bg); font-size:12px; font-weight:700;
            border-radius:8px; padding:5px 8px; display:none; z-index:2; }
  .tc-tip.show { display:block; }
  .tc-empty { font-size:12px; color: var(--faint); line-height:1.45; padding:12px 0 6px; }
  .tc-seg { display:flex; gap:4px; }
  .tc-seg button { background: var(--surface2); border:1px solid var(--line); color: var(--muted); font:inherit; font-size:12px; font-weight:700;
                   border-radius:6px; padding:2px 6px; cursor:pointer; text-transform:uppercase; }
  .tc-seg button.on { color: var(--ink); border-color: var(--muted); }
  .hit { fill: transparent; cursor:pointer; }

  /* ---- worth thinking about ---- */
  .ins { background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px 8px; margin-bottom:13px; }
  .ins-item { display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); text-decoration:none; color: var(--ink); }
  .ins-item:first-of-type { border-top:none; }
  .ins-dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .ins-text { flex:1; font-size:14px; line-height:1.45; }
  .ins-text b { font-weight:700; }
  .ins-app { font-size:12px; font-weight:700; color: var(--faint); text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; margin-top:3px; }
  .ins.folded { padding-bottom:14px; }
  .ins-head { display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color: var(--ink); padding:0; margin-bottom:6px; cursor:pointer; font:inherit; text-align:left; }
  .ins.folded .ins-head { margin-bottom:0; }
  .ins-counts { margin-left:auto; display:flex; gap:10px; }
  .ins-count { font-size:12px; font-weight:700; color: var(--ink); display:flex; align-items:center; gap:5px; font-variant-numeric: tabular-nums; }
  .ins-count i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ins-chev { color: var(--muted); transition: transform .15s; transform: rotate(-90deg); }
  .ins-head.open .ins-chev { transform: none; }
  .ins-more { background:none; border:none; color: var(--brand); font:inherit; font-size:12px; font-weight:700; padding:8px 0 4px; cursor:pointer; }
  .ins-ok { font-size:13px; color: var(--muted); padding:4px 0 8px; }

  /* ---- how you're tracking ---- */
  .track { background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px 6px; margin-bottom:13px; }
  .tr-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .tr-title { font-family: var(--font-display); font-size:15px; text-transform:uppercase; letter-spacing:0.06em; }
  .tr-when { font-size:12px; color: var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
  .pb { margin-bottom:13px; }
  .rings { display:grid; gap:6px; text-align:center; padding-bottom:10px; }
  .ring svg { width:100%; max-width:80px; height:auto; display:block; margin:0 auto; }
  .ring .rv { fill: var(--ink); font-family: var(--font-display); font-size:16px; }
  .ring .rt { fill: var(--muted); font-size:12px; font-weight:700; }
  .ring .rl { font-size:12px; font-weight:700; color: var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:5px; }
  .ring .rs { font-size:12px; font-weight:700; margin-top:1px; }
  .pb-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px; }
  .pb-name { font-size:13px; font-weight:600; white-space:nowrap; }
  .pb-name .app { color: var(--faint); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; margin-left:5px; }
  .pb-val { font-family: var(--font-display); font-size:15px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .pb-val .of { font-size:12px; color: var(--muted); font-family: var(--font-body); font-weight:700; }
  .pb-track { position:relative; height:9px; background: var(--surface2); border-radius:5px; overflow:visible; }
  .pb-fill { height:100%; border-radius:5px; transition: width .4s ease; }
  .pb-pace { position:absolute; top:-3px; bottom:-3px; width:2px; background: var(--ink); opacity:.7; border-radius:1px; }
  .pb-note { font-size:12px; font-weight:700; margin-top:5px; }
  .tr-legend { font-size:12px; color: var(--faint); text-align:center; margin: -4px 0 14px; }
  .tr-legend i { display:inline-block; width:2px; height:9px; background: var(--ink); opacity:.7; vertical-align:-1px; margin-right:4px; }

  .note { font-size:12px; color: var(--faint); text-align:center; line-height:1.5; margin-top:18px; }

  /* ---- settings ---- */
  .set-group { margin-bottom:22px; }
  .set-group h2 { font-family: var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); margin:0 0 8px; font-weight:400; }
  .set-row { display:flex; align-items:center; gap:12px; background: var(--surface); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:7px; }
  .set-row .sr-name { flex:1; font-size:14px; }
  .set-row .sr-val { font-size:12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .switch { width:44px; height:26px; border-radius:999px; background: var(--surface2); border:1px solid var(--line); position:relative; flex-shrink:0; cursor:pointer; transition: background .15s; }
  .switch::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background: var(--faint); transition: transform .15s, background .15s; }
  .switch.on { background: var(--brand); border-color: var(--brand); }
  .switch.on::after { transform: translateX(18px); background: var(--brand-ink); }
  .set-intro { font-size:13px; color: var(--muted); line-height:1.55; margin: 0 0 20px; }

  /* ---- tabbar ---- */
  nav.tabbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; z-index:30;
    background: var(--surface); border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom,0px); display:flex; }
  .tab { flex:1; border:none; background:none; padding:11px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:3px; color: var(--faint); cursor:pointer; font-family: var(--font-body); }
  .tab.active { color: var(--brand); }
  .tab .ic { display:inline-block; padding:2px 14px; border-radius:999px; transition:background .15s; }
  .tab.active .ic { background: rgba(255,74,22,.16); }

  .tab .ic { font-size:17px; }
  .tab .lb { font-size:12px; font-weight:700; }

  /* Shared icon set (Phosphor Bold, MIT licence) */
  .ci { width:1em; height:1em; display:inline-block; vertical-align:-0.14em; flex:none; }
  .tab .ic { line-height:0; padding:4px 14px; }
  .tab .ic .ci { width:22px; height:22px; display:block; }
  .empty-state .emoji .ci { color: var(--ink-soft, var(--muted)); }
</style>
</head>

<div class="app">
  <header class="topbar">
    <span class="brand">
      <svg viewBox="68 68 376 376" aria-hidden="true"><path d="M390.2,154.9 A168,168 0 0 1 179.7,405.7 M121.8,357.1 A168,168 0 0 1 332.3,106.3" fill="none" stroke="var(--brand)" stroke-width="30"/><g fill="var(--ink)" transform="translate(256 256) skewX(-12) translate(-256 -256) translate(156.0 156)"><rect x="0" y="0" width="86" height="86" rx="10"/><rect x="0" y="114" width="86" height="86" rx="10"/><rect x="114" y="0" width="86" height="86" rx="10"/><rect x="114" y="114" width="86" height="86" rx="10"/></g></svg>

  <main>

<script>

  // Shared date format across all apps (NZ style): "Thu 24 Sep", "24 Sep", "24 September", "Thursday"
  function fmtDate(d, opt) {
    var DS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    opt = opt || {}; var out = [];
    if (opt.weekday) out.push(opt.weekday === 'long' ? DL[d.getDay()] : DS[d.getDay()]);
    if (opt.day) out.push(d.getDate());
    if (opt.month) out.push(opt.month === 'long' ? ML[d.getMonth()] : MS[d.getMonth()]);
    return out.join(' ');
  }
(function () {
  "use strict";

  /* ==================================================================
     CONFIG — this is the part you edit.
     ==================================================================

     TO ADD A NEW APP to the dashboard:
       Copy one of the blocks below, change id / label / key / url,
       and list the numbers you want from its summary.
       ("key" must match the localStorage key that app writes —
        see the App Bundle: Data Sharing Spec.)

     TO ADD A NEW NUMBER to an app already listed:
       Add one line to its "metrics" list:
         { id: 'shortName', label: 'What it says', get: function (d) { return d.someField; } }
       - "d" is that app's summary.data object.
       - "label" is the small caption under the number.
       - Optional extras:
           unit: 'kg'                     -> small unit after the number
           of: function (d) { ... }       -> shows "/ target" beside it
           flag: function (d) { ... }     -> true colours the number orange
           on: false                      -> hidden until switched on in Settings
       Anything switched off in Settings stays off until you switch it
       back on — you don't need to edit this file to hide something.
     ================================================================== */

  var APPS = [
    {
      id: 'forge',
      label: 'Forge',
      key: 'forge_summary',
      url: '../Forge/',
      metrics: [
        { id: 'week',   label: 'Workouts',  get: function (d) { return d.weekWorkoutCount; },
                                            of:  function (d) { return d.weekTarget; } },
        { id: 'streak', label: 'Day streak', get: function (d) { return d.currentStreakDays; },
                                            flag: function (d) { return d.currentStreakDays >= 3; } },
        { id: 'today',  label: 'Trained today', get: function (d) { return d.workedOutToday ? 'Yes' : 'No'; },
                                            flag: function (d) { return d.workedOutToday; } },
        { id: 'bw',     label: 'Bodyweight', get: function (d) { return d.bodyweightKg; }, unit: 'kg' },
        { id: 'total',  label: 'Sessions', get: function (d) { return d.totalWorkouts; }, on: false },
        { id: 'level',  label: 'Level', get: function (d) { return d.level; }, on: false }
      ]
    },
    {
      id: 'fuel',
      label: 'Fuel',
      key: 'fuel_summary',
      url: '../Fuel/',
      metrics: [
        { id: 'kcal',    label: 'Calories', get: function (d) { return d.today && d.today.calories; },
                                            of:  function (d) { return d.targets && d.targets.calories; } },
        { id: 'protein', label: 'Protein', get: function (d) { return d.today && d.today.protein_g; }, unit: 'g',
                                            of:  function (d) { return d.targets && d.targets.protein_g; } },
        { id: 'fibre',   label: 'Fibre', get: function (d) { return d.today && d.today.fibre_g; }, unit: 'g',
                                            of:  function (d) { return d.targets && d.targets.fibre_g; } },
        { id: 'water',   label: 'Water', get: function (d) { return d.today && d.today.water_ml; }, unit: 'ml',
                                            of:  function (d) { return d.targets && d.targets.water_ml; } }
      ]
    },
    {
      id: 'mind',
      label: 'Forge Mind',
      key: 'mind_summary',
      url: '../Mind/',
      metrics: [
        { id: 'mins',   label: 'Minutes', get: function (d) { return d.weekMinutesLogged; },
                                          of:  function (d) { return d.weekMinutesTarget; } },
        { id: 'streak', label: 'Day streak', get: function (d) { return d.currentStreakDays; },
                                          flag: function (d) { return d.currentStreakDays >= 3; } }
      ]
    },
    {
      id: 'finance',
      label: 'Finance',
      key: 'finance_summary',
      url: '../Finance/',
      metrics: [
        { id: 'left',   label: 'Left of pay', get: function (d) { return nzd(d.leftOfPay); },
                                             flag: function (d) { return d.leftOfPay !== null && d.leftOfPay < 0; } },
        { id: 'spent',  label: 'Spent', get: function (d) { return nzd(d.spentThisPeriod); } },
        { id: 'days',   label: 'Days to go', get: function (d) { return d.daysLeftInPeriod; } },
        { id: 'bills',  label: 'Bills to come', get: function (d) { return d.upcomingBillsTotal ? nzd(d.upcomingBillsTotal) : null; } },
        { id: 'over',   label: 'Over budget', get: function (d) { return d.budgetsOver ? d.budgetsOver.length : null; },
                                             flag: function (d) { return !!(d.budgetsOver && d.budgetsOver.length > 0); } },

    var f = Math.min(1, o.value / o.target), expected = o.target * o.pace, colour, word;

  /* ================= WORTH THINKING ABOUT =================
     Plain-language suggestions worked out from what the apps save.
     These are simple rules written in this file — not AI and not

     Each one: { level: 'act' | 'watch' | 'win', score (higher = more

  var DAY = 86400000;

  function buildInsights() {
    var out = [];
    var add = function (level, score, app, url, html) { out.push({ level: level, score: score, app: app, url: url, html: html }); };
    var now = new Date(), hour = now.getHours();
    var wsd = (now.getDay() + 6) % 7;            // 0 = Monday ... 6 = Sunday
    var daysLeftInWeek = 7 - wsd;                 // including today

    // ---------- Forge ----------
    var fo = readSummary({ key: 'forge_summary' });
    if (fo && fo.data) {
      var f = fo.data;
      var gaps = f.daysSinceByMuscle || {};
      var trainedAny = (f.workoutDates || []).length > 0;
      var main = ['Legs', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core'];
      var stale = main.map(function (m) { return { m: m, d: gaps[m] }; })
                      .filter(function (x) { return trainedAny && (x.d === null || x.d === undefined || x.d >= RULES.muscleGapDays); })

      if (stale.length) {

        var others = stale.slice(1, 3).map(function (x) { return lower(x.m); });

            (others.length ? ' · ' + others.join(', ') + ' due too' : ''));

                      .sort(function (a, b) { return (a.d === null ? -1 : a.d) === (b.d === null ? -1 : b.d) ? 0 : (a.d === null ? 1 : b.d === null ? -1 : b.d - a.d); });
      var PHRASE = { reading: 'any reading', learning: 'any learning', focus: 'focus training', meditation: 'meditation',
                     breathing: 'your breathing exercises', braingames: 'brain games' };
      var ph = function (c) { return PHRASE[c.key] || lower(c.label); };
      if (gapsM.length) {
        var g0 = gapsM[0];
        add('act', g0.d === null ? 50 : 55 + Math.min(15, g0.d), 'Mind', '../Mind/',
            '<b>' + esc(g0.c.label) + '</b> — ' + (g0.d === null ? 'not started this week' : g0.d + ' days since last session') +
            (gapsM.length > 1 ? ' · ' + gapsM.slice(1, 3).map(function (x) { return lower(x.c.label); }).join(', ') + ' too' : ''));
      }
      if (m.weekMinutesTarget && wsd >= 3) {
        var expected = m.weekMinutesTarget * (wsd + 1) / 7;
        if (m.weekMinutesLogged < expected * 0.6) {
          add('watch', 48, 'Mind', '../Mind/', '<b>Mind time</b> behind — ' + fmtMins(m.weekMinutesLogged) + ' of ' + fmtMins(m.weekMinutesTarget) + ', about ' + fmtMins((m.weekMinutesTarget - m.weekMinutesLogged) / daysLeftInWeek) + ' a day to catch up');
        }
      }
      if (m.currentStreakDays >= 5) add('win', 24, 'Mind', '../Mind/', '<b>' + m.currentStreakDays + '-day</b> mind-time streak');
    }

    // ---------- Finance ----------
    var fi = readSummary({ key: 'finance_summary' });
    if (fi && fi.data) {
      var n = fi.data;
      (n.owed || []).forEach(function (o) {
        add('act', 58, 'Finance', '../Finance/', '<b>' + esc(o.who) + '</b> owes you <b>' + money(o.amount) + '</b> for ' + esc(o.bill));
      });
      (n.budgets || []).forEach(function (b) {
        if (b.spent > b.budget) add('act', 62, 'Finance', '../Finance/', '<b>' + esc(b.cat) + '</b> over budget (' + money(b.spent) + ' / ' + money(b.budget) + ')');
        else if (b.forecast > b.budget * 1.05) add('watch', 52, 'Finance', '../Finance/', '<b>' + esc(b.cat) + '</b> heading over budget (' + money(b.forecast) + ' / ' + money(b.budget) + ')');
      });
      (n.upcomingBills || []).forEach(function (b) {
        var inD = -daysAgo(b.date);
        if (inD >= 0 && inD <= RULES.billSoonDays) add('watch', 44 - inD, 'Finance', '../Finance/', '<b>' + esc(b.name) + '</b> ' + money(b.amount) + ' due ' + (inD === 0 ? 'today' : inD === 1 ? 'tomorrow' : 'in ' + inD + ' days'));
      });
      if (n.leftOfPay !== null && n.leftOfPay !== undefined && n.leftOfPay < (n.upcomingBillsTotal || 0)) {
        add('act', 80, 'Finance', '../Finance/', '<b>Bills to come</b> (' + money(n.upcomingBillsTotal) + ') are more than what’s left of pay (' + money(n.leftOfPay) + ')');
      }
    }

    // ---------- the apps themselves ----------
    APPS.forEach(function (a) {
      var s = readSummary(a);
      var h = s ? hoursSince(s.updatedAt) : null;
      if (s && h !== null && h > 72) add('watch', 30, a.label, a.url, '<b>' + esc(a.label) + '</b> not opened in ' + Math.round(h / 24) + ' days — numbers may be out of date');
    });
    var lastB = null; try { lastB = localStorage.getItem('ecosystem_lastBackup'); } catch (e) {}
    if (lastB && hoursSince(lastB) > 48) add('watch', 42, 'Backup', '../Finance/', '<b>Backup</b> — last one ' + Math.round(hoursSince(lastB) / 24) + ' days ago');

    return out.sort(function (a, b) { return b.score - a.score; });
  }

  var showAllInsights = false;
  function insightsHtml() {
    var list = buildInsights();
    if (!APPS.some(function (a) { return readSummary(a); })) return '';
    var todo = list.filter(function (x) { return x.level !== 'win'; });
    var wins = list.filter(function (x) { return x.level === 'win'; });
    var perApp = {}, short = [];
    todo.forEach(function (x) { perApp[x.app] = (perApp[x.app] || 0) + 1; if (perApp[x.app] <= 1 && short.length < 3) short.push(x); });
    var shown = showAllInsights ? todo : short;
    var colour = { act: 'var(--brand)', watch: 'var(--gold)', win: 'var(--good)' };
    var item = function (x) {
      return '<a class="ins-item" href="' + esc(x.url) + '"><span class="ins-dot" style="background:' + colour[x.level] + '"></span>' +
             '<span class="ins-text">' + x.html + '</span><span class="ins-app">' + esc(x.app) + '</span></a>';
    };
    // Folded: the header still shows a count per colour, so you can see
    // at a glance whether anything needs you. Open/closed is remembered.
    var folded = !!prefs.insightsFolded;
    var nAct = todo.filter(function (x) { return x.level === 'act'; }).length, nWatch = todo.length - nAct;
    var counts = todo.length
      ? (nAct ? '<span class="ins-count"><i style="background:var(--brand)"></i>' + nAct + '</span>' : '') +
        (nWatch ? '<span class="ins-count"><i style="background:var(--gold)"></i>' + nWatch + '</span>' : '')
      : '<span class="ins-count"><i style="background:var(--good)"></i>all good</span>';
    var head = '<button class="ins-head' + (folded ? '' : ' open') + '" id="insToggle" aria-expanded="' + !folded + '">' +
                 '<span class="tr-title">Worth thinking about</span><span class="ins-counts">' + counts + '</span><span class="ins-chev">\u25BE</span></button>';
    if (folded) return '<div class="ins folded">' + head + '</div>';
    return '<div class="ins">' + head +
           (todo.length ? shown.map(item).join('') : '<div class="ins-ok">Nothing needs your attention right now.</div>') +
           (todo.length + wins.length > short.length ? '<button class="ins-more" id="insMore">' + (showAllInsights ? 'Show fewer' : 'Show all ' + (todo.length + wins.length)) + '</button>' : '') +
           (showAllInsights && wins.length ? wins.map(item).join('') : '') +
           '</div>';
  }


  /* ================= TREND CHARTS =================
     One small chart per app, built from the history each app shares.
     Orange = your numbers; dashed lines = targets and comparisons;
     green/amber bars = hit / missed target (the note below each chart
     says the same in words). Tap a bar or point to see its value. */

  var CHARTS = [
    { id: 'weight',  label: 'Bodyweight',            app: 'Forge' },
    { id: 'fuel',    label: 'Protein / calories',    app: 'Fuel' },
    { id: 'mind',    label: 'Mind time',              app: 'Mind' },
    { id: 'spend',   label: 'Spending vs last period', app: 'Finance' }
  ];
  if (!prefs.chartsOff) prefs.chartsOff = {};
  var VW = 150, VH = 52;   // chart drawing area (scaled to fit the card)

  function shortDate(ymd) { var p = ymd.split('-').map(Number); return fmtDate(new Date(p[0], p[1] - 1, p[2]), { day: 'numeric', month: 'short' }); }
  function scaleY(lo, hi) { if (hi - lo < 1e-9) { hi = lo + 1; } return function (v) { return (VH - 4) - (v - lo) / (hi - lo) * (VH - 10); }; }
  function refLine(y, colour, label) {
    return '<line x1="0" x2="' + VW + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + colour + '" stroke-width="1" stroke-dasharray="3 3" opacity=".75"/>';
  }
  // Bars: values[] (null = no data), each with its own colour and tip.
  function barsSvg(items, lo, hi, target) {
    var n = items.length, gap = 2, bw = (VW - gap * (n - 1)) / n, y = scaleY(lo, hi), base = VH - 2;
    var out = '';
    items.forEach(function (it, i) {
      var x = i * (bw + gap);
      if (it.v !== null && it.v !== undefined) {
        var top = Math.min(base - 2, y(it.v));
        out += '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (base - top).toFixed(1) + '" rx="2" fill="' + it.c + '"' + (it.o ? ' opacity="' + it.o + '"' : '') + '/>';
      } else {
        out += '<rect x="' + x.toFixed(1) + '" y="' + (base - 2) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" fill="var(--surface2)"/>';
      }
      out += '<rect class="hit" x="' + (x - gap / 2).toFixed(1) + '" y="0" width="' + (bw + gap).toFixed(1) + '" height="' + VH + '" data-tip="' + esc(it.tip) + '"/>';
    });
    if (target) out = refLine(y(target), 'var(--muted)') + out;
    return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" preserveAspectRatio="none">' + out + '</svg>';
  }
  // Lines: series = [{ pts: [values by x index, null = gap], colour, dash, width }], n = x slots.
  function linesSvg(series, n, lo, hi, refs, tips) {
    var y = scaleY(lo, hi), x = function (i) { return n <= 1 ? VW / 2 : i / (n - 1) * VW; };
    var out = (refs || []).map(function (r) { return refLine(y(r.v), r.c); }).join('');
    series.forEach(function (s) {
      var d = '', pen = false;
      s.pts.forEach(function (v, i) {
        if (v === null || v === undefined) { pen = false; return; }
        d += (pen ? ' L' : ' M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true;
      });
      if (d) out += '<path d="' + d + '" fill="none" stroke="' + s.colour + '" stroke-width="' + (s.width || 2) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + (s.o ? ' opacity="' + s.o + '"' : '') + '/>';
      if (s.dots) s.pts.forEach(function (v, i) { if (v !== null && v !== undefined) out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="1.6" fill="' + s.colour + '" opacity=".45"/>'; });
    });
    if (tips) for (var i = 0; i < n; i++) if (tips[i]) {
      var w = VW / Math.max(1, n - 1);
      out += '<rect class="hit" x="' + (x(i) - w / 2).toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + VH + '" data-tip="' + esc(tips[i]) + '"/>';
    }
    return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" preserveAspectRatio="none">' + out + '</svg>';
  }
  function chartCard(c, url, valueHtml, svg, note, extraTop) {
    return '<div class="tc" data-chart="' + c.id + '"><div class="tc-tip"></div>' +
             '<div class="tc-top"><span class="tc-l">' + esc(c.label) + '</span>' + (extraTop || '<a class="tc-open" href="' + url + '">' + esc(c.app) + ' ›</a>') + '</div>' +
             (svg ? '<div class="tc-v">' + valueHtml + '</div>' + svg + '<div class="tc-note">' + note + '</div>'
                  : '<div class="tc-empty">' + note + '</div>') +
           '</div>';
  }
  function lastNDays(n) { var out = [], d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (n - 1)); for (var i = 0; i < n; i++) { out.push(ymdLocal(d)); d.setDate(d.getDate() + 1); } return out; }

  function weightChart(c) {
    var s = readSummary({ key: 'forge_summary' }), h = s && s.data && s.data.bodyweightHistory;
    var days = lastNDays(28);
    var byDay = {}; (h || []).forEach(function (b) { byDay[b.date] = b.kg; });
    var raw = days.map(function (d) { return byDay[d] === undefined ? null : byDay[d]; });
    var have = raw.filter(function (v) { return v !== null; });
    if (have.length < 2) return chartCard(c, '../Forge/', '', '', 'Weigh in a few times in Forge and your 4-week trend shows here.');
    // 7-day average smooths out day-to-day water swings
    var avg = days.map(function (d, i) {
      var win = raw.slice(Math.max(0, i - 6), i + 1).filter(function (v) { return v !== null; });
      return win.length ? win.reduce(function (a, b) { return a + b; }, 0) / win.length : null;
    });
    var firstI = raw.findIndex(function (v) { return v !== null; });
    for (var i = 0; i < firstI; i++) avg[i] = null;
    var goal = s.data.bodyweightGoalKg;
    var lo = Math.min.apply(null, have), hi = Math.max.apply(null, have);
    if (goal && goal >= lo - 3 && goal <= hi + 3) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
    var pad = Math.max(0.4, (hi - lo) * 0.15); lo -= pad; hi += pad;
    var nowAvg = avg.filter(function (v) { return v !== null; }).slice(-1)[0], startAvg = avg.filter(function (v) { return v !== null; })[0];
    var change = nowAvg - startAvg;
    var toward = goal ? (Math.abs(nowAvg - goal) < Math.abs(startAvg - goal)) : null;
    var note = (Math.abs(change) < 0.1 ? 'Steady' : (change > 0 ? '▲ ' : '▼ ') + Math.abs(change).toFixed(1) + ' kg') + ' over 4 weeks' +
               (goal ? ' · goal ' + goal + ' kg' + (Math.abs(change) >= 0.1 ? (toward ? ' ✓ right way' : ' — wrong way') : '') : '');
    var tips = days.map(function (d, i) { return raw[i] !== null ? shortDate(d) + ' · ' + raw[i].toFixed(1) + ' kg (avg ' + avg[i].toFixed(1) + ')' : null; });
    var svg = linesSvg([{ pts: raw, colour: 'var(--brand)', width: 0, dots: true }, { pts: avg, colour: 'var(--brand)', width: 2.2 }],
                       days.length, lo, hi, goal && goal >= lo && goal <= hi ? [{ v: goal, c: 'var(--good)' }] : [], tips);
    return chartCard(c, '../Forge/', nowAvg.toFixed(1) + ' <small>kg avg</small>', svg, note);
  }

  function fuelChart(c) {
    var s = readSummary({ key: 'fuel_summary' }), d = s && s.data;
    var mode = prefs.fuelChart === 'calories' ? 'calories' : 'protein';
    var seg = '<span class="tc-seg"><button data-fuelmode="protein"' + (mode === 'protein' ? ' class="on"' : '') + '>Protein</button>' +
              '<button data-fuelmode="calories"' + (mode === 'calories' ? ' class="on"' : '') + '>kcal</button></span>';
    var lab = { id: 'fuel', label: 'Fuel', app: 'Fuel' };
    if (!d || !(d.history || []).length) return chartCard(lab, '../Fuel/', '', '', 'Log food in Fuel and your last two weeks show here.', seg);
    var key = mode === 'protein' ? 'protein_g' : 'calories', unit = mode === 'protein' ? 'g' : ' kcal';
    var target = (d.targets || {})[key];
    var byDay = {}; d.history.forEach(function (h) { if (h.items > 0) byDay[h.date] = h[key]; });
    var days = lastNDays(14), today = ymdLocal(new Date());
    var vals = days.map(function (x) { return byDay[x] === undefined ? null : byDay[x]; });
    var logged = days.filter(function (x) { return x !== today && byDay[x] !== undefined; });
    var hits = logged.filter(function (x) { return target && (mode === 'protein' ? byDay[x] >= target * 0.9 : byDay[x] <= target * 1.05); }).length;
    var avg = logged.length ? logged.reduce(function (a, x) { return a + byDay[x]; }, 0) / logged.length : null;
    var hi = Math.max.apply(null, vals.filter(function (v) { return v !== null; }).concat([target || 0])) * 1.08;
    var items = days.map(function (x, i) {
      var v = vals[i], ok = target && v !== null && (mode === 'protein' ? v >= target * 0.9 : v <= target * 1.05);
      return { v: v, c: !target ? 'var(--brand)' : ok ? 'var(--good)' : 'var(--gold)', o: x === today ? 0.5 : null,
               tip: shortDate(x) + (x === today ? ' (so far)' : '') + ' · ' + (v === null ? 'nothing logged' : num(v) + unit + (target ? ' of ' + num(target) + unit : '')) };
    });
    var note = target ? (mode === 'protein' ? 'Target hit ' : 'Under target ') + hits + ' of ' + logged.length + ' logged days' : 'Set a target in Fuel to compare';
    return chartCard(lab, '../Fuel/', (avg === null ? '–' : num(avg)) + ' <small>' + (mode === 'protein' ? 'g' : 'kcal') + ' avg</small>', barsSvg(items, 0, hi, target), note, seg);
  }

  function mindChart(c) {
    var s = readSummary({ key: 'mind_summary' }), w = s && s.data && s.data.weeklyTotals;
    if (!w || !w.length) return chartCard(c, '../Mind/', '', '', 'Log time in Mind and your last 8 weeks show here.');
    var target = w[w.length - 1].target;
    var hi = Math.max.apply(null, w.map(function (x) { return x.mins; }).concat([target || 0])) * 1.08;
    var items = w.map(function (x, i) {
      var cur = i === w.length - 1, ok = target && x.mins >= target;
      return { v: x.mins, c: ok ? 'var(--good)' : cur ? 'var(--brand)' : 'var(--gold)', o: cur && !ok ? 0.55 : null,
               tip: 'Week of ' + shortDate(x.week) + (cur ? ' (so far)' : '') + ' · ' + fmtMins(x.mins) + (target ? ' of ' + fmtMins(target) : '') };
    });
    var past = w.slice(0, -1), hitWeeks = target ? past.filter(function (x) { return x.mins >= target; }).length : 0;
    var note = target ? 'Target hit ' + hitWeeks + ' of the last ' + past.length + ' weeks · this week faded' : '';
    return chartCard(c, '../Mind/', fmtMins(w[w.length - 1].mins) + ' <small>this week</small>', barsSvg(items, 0, hi, target), note);
  }

  function spendChart(c) {
    var s = readSummary({ key: 'finance_summary' }), d = s && s.data;
    if (!d || !(d.spendByDay || []).length) return chartCard(c, '../Finance/', '', '', 'Open Finance to pull in your spending and see it against last period here.');
    var cur = d.spendByDay, last = d.lastPeriodByDay || [];
    var n = Math.max(cur.length, last.length, 2);
    var budget = d.incomeThisPeriod || null;   // reference line: this period's pay
    // Scale to the spending itself so the lines are readable; only show the
    // pay line when it's close enough to matter.
    var hi = Math.max.apply(null, cur.concat(last).concat([1])) * 1.1;
    if (budget && budget <= hi * 1.4) hi = Math.max(hi, budget * 1.05); else budget = null;
    var i = cur.length - 1, then = last[Math.min(i, last.length - 1)];
    var diff = (then === undefined) ? null : cur[i] - then;
    var note = diff === null ? 'No last period to compare yet'
             : (Math.abs(diff) < 5 ? 'Same as this point last period' : money(Math.abs(diff)) + (diff > 0 ? ' more' : ' less') + ' than this point last ' + (/fortnight/.test(d.periodLabel || '') ? 'fortnight' : 'month') + ' (dashed)');
    var tips = []; for (var k = 0; k < n; k++) tips.push('Day ' + (k + 1) + ' · ' + (cur[k] !== undefined ? money(cur[k]) + ' this period' : 'still to come') + (last[k] !== undefined ? ' · ' + money(last[k]) + ' last' : ''));
    var svg = linesSvg([{ pts: last, colour: 'var(--muted)', dash: '4 3', width: 1.6 }, { pts: cur, colour: 'var(--brand)', width: 2.4 }], n, 0, hi,
                       budget ? [{ v: budget, c: 'var(--danger)' }] : [], tips);
    var label = { id: 'spend', label: 'Spending', app: 'Finance' };
    return chartCard(label, '../Finance/', money(d.spentThisPeriod) + (d.incomeThisPeriod ? ' <small>of ' + money(d.incomeThisPeriod) + ' pay</small>' : ''), svg,
                     '<span style="color:' + (diff > 0 ? 'var(--gold)' : 'var(--muted)') + '">' + note + '</span>');
  }

  function trendsHtml() {
    var make = { weight: weightChart, fuel: fuelChart, mind: mindChart, spend: spendChart };
    var cards = CHARTS.filter(function (c) { return !prefs.chartsOff[c.id]; }).map(function (c) {
      try { return make[c.id](c); } catch (e) { return ''; }   // one broken chart never takes the page down
    }).join('');
    return cards ? '<div class="trends">' + cards + '</div>' : '';
  }
  function wireTrends(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.tc .hit'), function (h) {
      h.addEventListener('click', function (e) {
        var card = h.closest('.tc'), tip = card.querySelector('.tc-tip');
        tip.textContent = h.getAttribute('data-tip'); tip.classList.add('show');
        clearTimeout(tip._t); tip._t = setTimeout(function () { tip.classList.remove('show'); }, 2500);
        e.stopPropagation();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-fuelmode]'), function (b) {
      b.addEventListener('click', function () { prefs.fuelChart = b.dataset.fuelmode; savePrefs(prefs); renderHome(); });
    });
  }

  function renderHome() {
    var html = insightsHtml() + trackingHtml() + trendsHtml();
    html += '<div class="note">Everything here is read from this phone’s own storage. ' +
            'Log in each app as usual and this page catches up automatically.</div>';
    $('screen-home').innerHTML = html;
    wireTrends($('screen-home'));
    if ($('insToggle')) $('insToggle').addEventListener('click', function () {
      prefs.insightsFolded = !prefs.insightsFolded; savePrefs(prefs); renderHome();
    });
    if ($('insMore')) $('insMore').addEventListener('click', function () { showAllInsights = !showAllInsights; renderHome(); });
  }

  function renderSettings() {
    var html = '<p class="set-intro">Pick which charts show on the dashboard. ' +
               'Switching one off just hides it \u2014 nothing is deleted.</p>';
    html += '<div class="set-group"><h2>Charts</h2>' + CHARTS.map(function (c) {
      return '<div class="set-row"><span class="sr-name">' + esc(c.label) + '</span><span class="sr-val">' + esc(c.app) + '</span>' +
               '<button class="switch' + (prefs.chartsOff[c.id] ? '' : ' on') + '" data-chart="' + c.id + '" aria-label="Show ' + esc(c.label) + '"></button></div>';
    }).join('') + '</div>';
    $('screen-settings').innerHTML = html;
    Array.prototype.forEach.call($('screen-settings').querySelectorAll('.switch'), function (btn) {
      btn.addEventListener('click', function () {
        var on = !btn.classList.contains('on');
        btn.classList.toggle('on', on);
        prefs.chartsOff[btn.dataset.chart] = !on; savePrefs(prefs);
        renderHome();
      });
    });
  }

  function switchScreen(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.remove('active'); });
    $('screen-' + name).classList.add('active');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('active', t.dataset.screen === name);
    });
    if (name === 'settings') renderSettings(); else renderHome();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { switchScreen(t.dataset.screen); });
  });

  // Coming back to the tab after logging something elsewhere should refresh.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) renderHome();
  });

  function boot() {
    $('topSub').textContent = fmtDate(new Date(), { weekday:'short', day:'numeric', month:'short' });
    renderHome();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    }
  }

  boot();
})();
</script>
</body>
</html>
